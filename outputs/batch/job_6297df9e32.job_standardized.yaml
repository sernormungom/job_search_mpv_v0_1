    08 maj 2026 23:59 (4 dagar kvar)\nUppdragsbeskrivning\n\nFör vår kund söker vi en Samverksansledare för ett\
    \ separeringsprojekt i Majorna. \n\nVår kund planerar att genomföra en upphandling av ett separeringsprojekt\
    \ samt omläggning av dricksvattenledningar i området Majorna-Göteborg. Projektet omfattar planering, projektering\
    \ och genomförande av åtgärder inom befintligt VA. Kundens avsikt är att upphandla projektet som en totalentreprenad\
    \ med partnering som samverkansform.\n\nUppdraget innebär att bistå som stöd samt aktivt medverka i framtagandet\
    \ av upphandlingsunderlaget inför en planerad samverkansupphandling, som beräknas genomföras under 2026. Projektet\
    \ beräknas avslutas 2028. Detta uppdrag är särskilt utmanande på grund av att området är trafikintensivt, att\
    \ det finns parkering längs gatorna samt att flera skolor är belägna i området. Därtill saknas tillräcklig kännedom\
    \ om dagvattenledningarna, eftersom avloppsledningen är placerad i dagvattenledningen. Detta medför att det\
    \ inte är möjligt att genomföra filmning med traditionella TV-inspektionskameror.\n\nProjektet kommer att utföras\
