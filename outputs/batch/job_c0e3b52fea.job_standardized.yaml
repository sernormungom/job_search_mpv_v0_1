    For our client, we are looking for a DevOps Engineer - AWS.


    Experience

    · Mid/senior level.

    · Minimum 7-10 years of proven experience within relevant IT roles. A minimum of 4 years'' experience working
    as a DevOps Engineer.


    Team and job description

    You will join our CloudOps team and work closely with our dedicated Cloud Architect, Security Engineer, DevOps
    Engineers, and SysOps/Cloud Engineers. You will create and maintain cloud infrastructure by planning, improving,
    and enabling software solution deployments to the SKF cloud infrastructure. As one of our DevOps Engineers,
    you will work closely with developers to make sure that we build environments that suit the products. You will
    also work closely with the team to help optimize processes with scripts and enablement of infrastructure as
    code.


    You will contribute to long-term initiatives and ongoing feature enhancements across our environment, translating
    standards and strategic concepts into practical implementation. You will also develop a clear understanding
    of improvement areas and drive their execution in alignment with our deliverables.


    Key responsibilities

    · Help ensure smooth operations of the team´s cloud infrastructure.

    · Work closely with developers to streamline how code is built, deployed, and run in production.

    · Define, create, implement, and monitor automated processes for development, testing, release'
