[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-mvp"
version = "0.1.0"
description = "Local deterministic job-search and CV-generation prototype."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
browser = [
  "playwright>=1.44",
]
ui = [
  "streamlit>=1.36",
]

[project.scripts]
job-search-match = "jobsearch.matching.matcher:main"
job-search-batch = "jobsearch.pipeline.run_job_batch:main"
job-search-sources = "jobsearch.pipeline.run_sources_to_review:main"
job-search-tracker = "jobsearch.tracking.application_tracker:main"
job-search-selected-cv = "jobsearch.pipeline.run_selected_cv_pipeline:main"
job-search-verama = "jobsearch.sources.verama_playwright:main"
job-search-dashboard = "jobsearch.pipeline.run_dashboard:main"
job-search-standardizer = "jobsearch.standardization.llm_standardizer:main"

[tool.setuptools.packages.find]
include = ["job_search_mvp*", "jobsearch*"]

[tool.setuptools.package-data]
job_search_mvp = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
